services:
  web:
    container_name: geojson-maps.kyd.au
    build: .
    restart: always
    user: "1000:1000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.geojsonregions.rule=Host(`geojson-maps.kyd.au`)
      - traefik.http.routers.geojsonregions.entrypoints=websecure
      - traefik.http.routers.geojsonregions.tls.certresolver=le
      - traefik.http.routers.geojsonregions.middlewares=geojsonregions-compress
      - traefik.http.middlewares.geojsonregions-compress.compress=true
      - traefik.http.services.geojsonregions.loadbalancer.server.port=8080
      - traefik.docker.network=traefik_default
    networks:
      - traefik_default

  # Downloads and processes the Natural Earth outlines into ./static/countries.
  # Run with: docker compose run --rm countries-data
  countries-data:
    container_name: geojson-maps-data
    profiles: [data]
    build:
      context: .
      dockerfile: scripts/Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./static/countries:/output

networks:
  traefik_default:
    external: true
